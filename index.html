<!DOCTYPE html>
<html>
<head>
    <title>🚗 Vehicle Trip Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#f4f6f9; }
        #map { height: 100vh; width: 100%; }
        .control-panel { position:absolute; top:10px; left:10px; background:white; padding:15px; border-radius:12px; z-index:1000; box-shadow:0 4px 20px rgba(0,0,0,0.3); width: 380px; max-height: 92vh; overflow-y:auto; }
        .tabs { display:flex; margin-bottom:15px; background:#f1f1f1; border-radius:8px; flex-wrap:wrap; }
        .tab { flex:1; padding:12px; text-align:center; cursor:pointer; border-radius:8px; font-weight:bold; min-width:75px; }
        .tab.active { background:#4285F4; color:white; }
        .content { display:none; }
        .content.active { display:block; }
        input, button, select { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ddd; }
        button { background:#4285F4; color:white; border:none; font-weight:bold; cursor:pointer; }
        .success-btn { background:#34A853; }
        .edit-btn { background:#FF9800; color:white; padding:5px 10px; font-size:13px; }
        .delete-btn { background:#f44336; color:white; padding:5px 10px; font-size:13px; }
        .vehicle-item { padding:12px; margin:8px 0; background:#e8f0fe; border-radius:8px; }
    </style>
</head>
<body>
    <div class="control-panel">
        <h2>🚗 Vehicle Trip Tracker</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab(0)">Start Trip</div>
            <div class="tab" onclick="showTab(1)">Add Vehicle</div>
            <div class="tab" onclick="showTab(2)">Vehicles</div>
            <div class="tab" onclick="showTab(3)">Geofences</div>
        </div>

        <!-- Tab 0: Start Trip -->
        <div class="content active" id="tab0">
            <h3>🚀 Start New Trip</h3>
            <input type="text" id="tripVehicleId" placeholder="Enter Vehicle ID" style="text-transform:uppercase;">
            <button class="success-btn" onclick="startNewTrip()">Start Live Tracking</button>
        </div>

        <!-- Tab 1: Add Vehicle -->
        <div class="content" id="tab1">
            <h3>Add New Vehicle</h3>
            <input type="text" id="vehId" placeholder="Vehicle ID *" style="text-transform:uppercase;">
            <input type="text" id="vehName" placeholder="Vehicle Name">
            <input type="text" id="make" placeholder="Make">
            <input type="text" id="model" placeholder="Model">
            <button onclick="addVehicle()">Add Vehicle</button>
        </div>

        <!-- Tab 2: Vehicles List with Edit & Delete -->
        <div class="content" id="tab2">
            <h3>🚛 All Vehicles</h3>
            <button onclick="loadVehicles()">🔄 Refresh</button>
            <div id="vehicleList"></div>
        </div>

        <!-- Tab 3: Geofences with Edit & Delete -->
        <div class="content" id="tab3">
            <h3>📍 Geofences</h3>
            <input type="text" id="fenceName" placeholder="Point Name">
            <button onclick="addGeofence()">Add at Map Center</button>
            <hr>
            <button onclick="loadGeofences()">🔄 Refresh</button>
            <div id="geofenceList"></div>
        </div>
    </div>

    <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map;
    let geofenceCircles = [];
    let editingVehicleId = null;
    let editingGeofenceId = null;

    function initMap() {
        map = L.map('map').setView([19.9975, 73.7898], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }

    function showTab(n) {
        document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
        document.querySelectorAll('.content').forEach((c,i) => c.classList.toggle('active', i===n));
    }

    // ================= VEHICLES =================
    async function addVehicle() {
        const vehId = document.getElementById('vehId').value.trim().toUpperCase();
        if (!vehId) return alert("Vehicle ID required!");

        const data = {
            vehicle_id: vehId,
            vehicle_name: document.getElementById('vehName').value.trim(),
            make: document.getElementById('make').value.trim(),
            model: document.getElementById('model').value.trim()
        };

        try {
            const res = await fetch('/add_vehicle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
            loadVehicles();
        } catch(e) { alert("Server Error"); }
    }

    async function loadVehicles() {
        const res = await fetch('/vehicles');
        const vehicles = await res.json();
        const container = document.getElementById('vehicleList');
        container.innerHTML = '';

        if (vehicles.length === 0) {
            container.innerHTML = '<p>No vehicles added yet.</p>';
            return;
        }

        vehicles.forEach(v => {
            const div = document.createElement('div');
            div.className = 'vehicle-item';
            div.innerHTML = `
                <strong>${v.vehicle_id}</strong><br>
                ${v.vehicle_name} | ${v.make} ${v.model}<br>
                <button class="edit-btn" onclick="editVehicle('${v.vehicle_id}')">Edit</button>
                <button class="delete-btn" onclick="deleteVehicle('${v.vehicle_id}')">Delete</button>
            `;
            container.appendChild(div);
        });
    }

    function editVehicle(id) {
        alert(`Edit functionality for Vehicle ${id} - Coming Soon`);
    }

    async function deleteVehicle(id) {
        if (!confirm(`Delete vehicle ${id}?`)) return;
        alert(`Vehicle ${id} deleted (Demo)`);
        loadVehicles();
    }

    // ================= GEOFENCES =================
    async function addGeofence() {
        const name = document.getElementById('fenceName').value.trim() || "Pickup Point";
        const center = map.getCenter();
        const data = { name, lat: center.lat, lng: center.lng, radius: 500, type: "pickup" };

        try {
            const res = await fetch('/add_geofence', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
            loadGeofences();
        } catch(e) { alert("Failed"); }
    }

    async function loadGeofences() {
        geofenceCircles.forEach(c => map.removeLayer(c));
        geofenceCircles = [];

        const res = await fetch('/geofences');
        const fences = await res.json();
        const container = document.getElementById('geofenceList');
        container.innerHTML = '';

        fences.forEach(f => {
            const circle = L.circle([f.lat, f.lng], {color:'green', fillColor:'#4CAF50', fillOpacity:0.25, radius: f.radius}).addTo(map);
            geofenceCircles.push(circle);

            const div = document.createElement('div');
            div.className = 'vehicle-item';
            div.innerHTML = `
                <strong>${f.name}</strong><br>
                📍 ${f.lat.toFixed(5)}, ${f.lng.toFixed(5)}<br>
                <button class="edit-btn" onclick="editGeofence(${f.id})">Edit</button>
                <button class="delete-btn" onclick="deleteGeofence(${f.id})">Delete</button>
            `;
            container.appendChild(div);
        });
    }

    function editGeofence(id) {
        alert(`Edit Geofence ${id} - Coming Soon`);
    }

    async function deleteGeofence(id) {
        if (!confirm("Delete this geofence?")) return;
        try {
            const res = await fetch(`/delete_geofence/${id}`, { method: 'DELETE' });
            const result = await res.json();
            alert(result.message);
            loadGeofences();
        } catch(e) { alert("Delete failed"); }
    }

    function startNewTrip() {
        const id = document.getElementById('tripVehicleId').value.trim().toUpperCase();
        if (id) alert(`✅ Live tracking started for ${id}`);
    }

    window.onload = () => {
        initMap();
        loadVehicles();
        loadGeofences();
    };
</script>
</body>
</html>
