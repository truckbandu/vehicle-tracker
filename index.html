<!DOCTYPE html>
<html>
<head>
    <title>🚗 Vehicle Trip Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#f4f6f9; }
        #map { height: 100vh; width: 100%; }
        .control-panel { position:absolute; top:10px; left:10px; background:white; padding:15px; border-radius:12px; z-index:1000; box-shadow:0 4px 20px rgba(0,0,0,0.3); width: 380px; max-height: 92vh; overflow-y:auto; }
        .tabs { display:flex; margin-bottom:15px; background:#f1f1f1; border-radius:8px; flex-wrap:wrap; }
        .tab { flex:1; padding:10px; text-align:center; cursor:pointer; border-radius:8px; font-weight:bold; font-size:13px; }
        .tab.active { background:#4285F4; color:white; }
        .content { display:none; }
        .content.active { display:block; }
        input, button, select { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ddd; }
        button { background:#4285F4; color:white; border:none; font-weight:bold; cursor:pointer; }
        .success-btn { background:#34A853; }
        .vehicle-item { padding:12px; margin:8px 0; background:#e8f0fe; border-radius:8px; }
    </style>
</head>
<body>
    <div class="control-panel">
        <h2>🚗 Vehicle Trip Tracker</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="showTab(0)">Start Trip</div>
            <div class="tab" onclick="showTab(1)">Add Vehicle</div>
            <div class="tab" onclick="showTab(2)">Vehicles</div>
            <div class="tab" onclick="showTab(3)">Drivers</div>
            <div class="tab" onclick="showTab(4)">Geofences</div>
        </div>

        <!-- Other tabs same as before... -->

        <!-- New Drivers Tab -->
        <div class="content" id="tab3">
            <h3>👤 Add New Driver</h3>
            <input type="text" id="driverName" placeholder="Driver Full Name *">
            <input type="text" id="licenceNo" placeholder="Licence No *">
            <input type="file" id="licenceImage" accept="image/*">
            <input type="text" id="driverMobile" placeholder="Mobile No *">
            <input type="text" id="homeNo" placeholder="Home Phone">
            <input type="text" id="village" placeholder="Village">
            <input type="text" id="district" placeholder="District">
            <input type="text" id="state" placeholder="State">
            <input type="text" id="pin" placeholder="PIN Code">
            <input type="text" id="aadharNo" placeholder="Aadhar No *">
            <input type="file" id="aadharImage" accept="image/*">
            <input type="text" id="agentName" placeholder="Agent Name">

            <button onclick="addDriver()">Add Driver</button>
        </div>

        <!-- Rest of tabs... -->
    </div>

    <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // ... (keep your existing code for other functions)

    async function addDriver() {
        const formData = new FormData();
        formData.append('name', document.getElementById('driverName').value);
        formData.append('licence_no', document.getElementById('licenceNo').value);
        formData.append('mobile', document.getElementById('driverMobile').value);
        formData.append('home_no', document.getElementById('homeNo').value);
        formData.append('village', document.getElementById('village').value);
        formData.append('district', document.getElementById('district').value);
        formData.append('state', document.getElementById('state').value);
        formData.append('pin', document.getElementById('pin').value);
        formData.append('aadhar_no', document.getElementById('aadharNo').value);
        formData.append('agent_name', document.getElementById('agentName').value);

        if (document.getElementById('licenceImage').files[0]) {
            formData.append('licence_image', document.getElementById('licenceImage').files[0]);
        }
        if (document.getElementById('aadharImage').files[0]) {
            formData.append('aadhar_image', document.getElementById('aadharImage').files[0]);
        }

        try {
            const res = await fetch('/add_driver', { method: 'POST', body: formData });
            const result = await res.json();
            alert(result.message);
        } catch(e) {
            alert("Failed to add driver");
        }
    }

    // Call loadDrivers() if you want to show list later
</script>
</body>
</html>
