<!DOCTYPE html>
<html>
<head>
    <title>🚗 Vehicle Trip Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin:0; font-family:Arial, sans-serif; background:#f4f6f9; }
        #map { height: 100vh; width: 100%; }
        .control-panel { 
            position:absolute; top:10px; left:10px; background:white; 
            padding:15px; border-radius:12px; z-index:1000; box-shadow:0 4px 20px rgba(0,0,0,0.3); 
            width: 380px; max-height: 92vh; overflow-y:auto;
        }
        .hamburger { font-size:28px; cursor:pointer; padding:10px; }
        .tabs { display:none; flex-direction:column; background:#f1f1f1; border-radius:8px; margin-top:10px; }
        .tabs.active { display:flex; }
        .tab { padding:12px; text-align:left; cursor:pointer; border-bottom:1px solid #ddd; }
        .tab:last-child { border-bottom:none; }
        .tab.active { background:#4285F4; color:white; }
        .content { display:none; }
        .content.active { display:block; }
        input, button, select { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #ddd; }
        button { background:#4285F4; color:white; border:none; font-weight:bold; cursor:pointer; }
        .success-btn { background:#34A853; }
        .vehicle-item { padding:12px; margin:8px 0; background:#e8f0fe; border-radius:8px; }
        h4 { margin:15px 0 8px 0; color:#333; }
    </style>
</head>
<body>
    <div class="control-panel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>🚗 Vehicle Trip Tracker</h2>
            <span class="hamburger" onclick="toggleMenu()">☰</span>
        </div>
        
        <div class="tabs" id="menuTabs">
            <div class="tab active" onclick="showTab(0)">Start Trip</div>
            <div class="tab" onclick="showTab(1)">Add Vehicle</div>
            <div class="tab" onclick="showTab(2)">Vehicles</div>
            <div class="tab" onclick="showTab(3)">Drivers</div>
            <div class="tab" onclick="showTab(4)">Geofences</div>
        </div>

        <!-- Tab 0: Start Trip -->
        <div class="content active" id="tab0">
            <h3>🚀 Start New Trip</h3>
            <input type="text" id="tripVehicleId" placeholder="Enter Vehicle ID" style="text-transform:uppercase;">
            <button class="success-btn" onclick="startNewTrip()">Start Live Tracking</button>
        </div>

        <!-- Tab 1: Add Vehicle -->
        <div class="content" id="tab1">
            <h3>Add New Vehicle</h3>
            <input type="text" id="vehId" placeholder="Vehicle ID *" style="text-transform:uppercase;">
            <input type="text" id="vehName" placeholder="Vehicle Name (Optional)">
            <input type="text" id="make" placeholder="Make">
            <input type="text" id="model" placeholder="Model">
            <input type="text" id="chassisNo" placeholder="Chassis No">
            <input type="text" id="engineNo" placeholder="Engine No">
            <input type="text" id="tyres" placeholder="Tyres">
            <input type="text" id="ownerName" placeholder="Owner Name">

            <h4>📅 Validity Details</h4>
            <label>RC Validity</label>
            <input type="date" id="rdValidity">
            
            <label>Fitness Validity</label>
            <input type="date" id="fitnessValidity">
            
            <label>Permit Validity</label>
            <input type="date" id="permitValidity">
            
            <label>Insurance Validity</label>
            <input type="date" id="insuranceValidity">
            
            <label>PUC Validity</label>
            <input type="date" id="pucValidity">
            
            <button onclick="addVehicle()">Add Vehicle</button>
        </div>

        <!-- Tab 2: Vehicles -->
        <div class="content" id="tab2">
            <h3>🚛 All Vehicles</h3>
            <button onclick="loadVehicles()">🔄 Refresh List</button>
            <div id="vehicleList"></div>
        </div>

        <!-- Tab 3 & 4: Drivers & Geofences (can be expanded later) -->
        <div class="content" id="tab3">
            <h3>👤 Drivers</h3>
            <p>Driver management coming soon...</p>
        </div>

        <div class="content" id="tab4">
            <h3>📍 Geofences</h3>
            <input type="text" id="fenceName" placeholder="Point Name">
            <button onclick="addGeofence()">Add at Map Center</button>
            <hr>
            <button onclick="loadGeofences()">Refresh Map & List</button>
            <div id="geofenceList"></div>
        </div>
    </div>

    <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    let map;

    function initMap() {
        map = L.map('map').setView([19.9975, 73.7898], 12);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    }

    function toggleMenu() {
        document.getElementById('menuTabs').classList.toggle('active');
    }

    function showTab(n) {
        document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
        document.querySelectorAll('.content').forEach((c,i) => c.classList.toggle('active', i===n));
        document.getElementById('menuTabs').classList.remove('active'); // Close menu after selection
    }

    async function addVehicle() {
        const vehId = document.getElementById('vehId').value.trim().toUpperCase();
        if (!vehId) return alert("❌ Vehicle ID is required!");

        const data = {
            vehicle_id: vehId,
            vehicle_name: document.getElementById('vehName').value.trim(),
            make: document.getElementById('make').value.trim(),
            model: document.getElementById('model').value.trim(),
            chassis_no: document.getElementById('chassisNo').value.trim(),
            engine_no: document.getElementById('engineNo').value.trim(),
            tyres: document.getElementById('tyres').value.trim(),
            owner_name: document.getElementById('ownerName').value.trim(),
            driver_name: document.getElementById('driverName').value.trim(),
            driver_phone: document.getElementById('driverPhone').value.trim(),
            rd_validity: document.getElementById('rdValidity').value,
            fitness_validity: document.getElementById('fitnessValidity').value,
            permit_validity: document.getElementById('permitValidity').value,
            insurance_validity: document.getElementById('insuranceValidity').value,
            puc_validity: document.getElementById('pucValidity').value
        };

        try {
            const res = await fetch('/add_vehicle', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            alert(result.message);
            if (result.status === "success") loadVehicles();
        } catch(e) { alert("❌ Server Error"); }
    }

    async function loadVehicles() {
        const res = await fetch('/vehicles');
        const vehicles = await res.json();
        const container = document.getElementById('vehicleList');
        container.innerHTML = vehicles.length ? '' : '<p>No vehicles added yet.</p>';
        vehicles.forEach(v => {
            const div = document.createElement('div');
            div.className = 'vehicle-item';
            div.innerHTML = `<strong>${v.vehicle_id}</strong><br>${v.make || ''} ${v.model || ''}`;
            container.appendChild(div);
        });
    }

    function startNewTrip() {
        const id = document.getElementById('tripVehicleId').value.trim().toUpperCase();
        if (id) alert(`✅ Live tracking started for ${id}`);
    }

    window.onload = () => {
        initMap();
        loadVehicles();
    };
</script>
</body>
</html>
